name: Build CSS

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-css:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build CSS
        run: npm run build:css